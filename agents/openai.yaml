interface:
  display_name: "Conversation History Recovery"
  short_description: "Recover decisive prior requirements and failures, then report or execute the validated correction."
  default_prompt: "Use $conversation-history-recovery-skill when the user explicitly asks for history reconstruction, complains that prior work missed the intent, or needs decisive context from another conversation. Search indexed metadata first, read only the original conversations and primary sources that can change the next action, preserve exact coverage for all/fully requests, treat summaries as locators, and stop searching once evidence is sufficient. If the user requested a correction or continuation, implement and verify it in the same task without adding new authority gates."
