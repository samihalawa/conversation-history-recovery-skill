interface:
  display_name: "Conversation History Recovery"
  short_description: "Recover complete history and execute verified corrections"
  default_prompt: "Use $conversation-history-recovery-skill when the user explicitly asks for history reconstruction, complains that prior work missed the intent, or needs decisive context from another conversation. Search the native conversation index first; for Claude Code web or Remote Control links, check native bridgeSessionId/sessionId/cwd metadata and exact local transcript mapping before cloud login or declaring history missing. Then read the relevant original conversations completely in bounded, nontruncated batches with action-changing nested evidence. Retain IDs, counts and cursor/sequence boundaries, resume missing slices and preserve exact coverage for all/fully requests. Treat summaries and memory as locators; resolve intent by direct human authorship and chronology, not file modification time or newer summaries. Diagnose failed reads using current supported routes without fixed retry quotas or general capability gates. Stop searching once evidence is sufficient. If the user requested a correction or continuation, implement and verify it in the same task without adding new authority gates."
